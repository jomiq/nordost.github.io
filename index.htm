<html>
<head>
  <meta charset="UTF-8"> 
  <style>
  #clickme {
    margin-top: 4rem;
    display: block;
    margin-left: auto;
    margin-right: auto;
    color: black;
    background-color: white; 
    font-size: 2rem;
    border: 3px solid black;
    border-radius: 0.8rem;
    padding: 0.5rem 1.0rem;
  }

  #clickme:hover {
    box-shadow: 10px 5px 5px lightgray;
    transform: translate(-5px, -5px);
  }

  #clickme:active {
    box-shadow: unset;
    transform: unset
  }

  svg#logo {
    display: block;
    margin-top: 200px;
    width: 70vw;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  svg#logo.nordan g.rotateme {
      transition: all 0.3s ease-in-out;
      transform: rotate(0deg) translateY(0%) translateX(0%);
  }

  svg#logo.ostan g.rotateme {
      transform: rotate(48deg) translateY(-46%) translateX(7.6%);
      transition: all 0.3s ease-in-out;
  }
  </style>
  <script type="text/javascript">
  function rotate(e) {
    const logo = document.querySelector("#logo");
    if(logo.classList.contains("ostan") || logo.classList.contains("nordan")) {
      logo.classList.toggle("nordan");
      logo.classList.toggle("ostan");
    } else {
      logo.classList.add("ostan");
    }
  }

  document.addEventListener("DOMContentLoaded", (e) => {
    const logo = document.querySelector("#logo");
    const btn = document.querySelector("#clickme");
    logo.addEventListener("click", rotate);
    btn.addEventListener("click", rotate);
  });
  </script>
